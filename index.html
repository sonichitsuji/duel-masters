<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020208">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/duel-masters/manifest.json">
    <title>Duel Masters Simulator</title>
    <style>
      /* PC版UIの拡大。
         このUIはスマホ向けに px 直書きで組んであるので、個々の値をいじる代わりに
         広い画面（マウス操作のPC）だけルートの zoom でまとめて拡大する。
         zoom は文字も余白もカードもまとめて拡大したうえでレイアウトを組み直すので、
         transform: scale と違って文字がぼやけない。
         ビューポート単位(vh/vw)だけは zoom で二重に拡大されてしまうため、
         使う側で --ui-scale で割り戻す。 */
      :root {
        --ui-scale: 1;
      }
      @media (min-width: 900px) and (pointer: fine) {
        :root {
          --ui-scale: 1.5;
        }
      }
      body {
        zoom: var(--ui-scale);
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        background-color: #020208;
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        background-color: #020208;
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: -webkit-fill-available;
      }
      #root {
        background-color: #020208;
        min-height: calc(100vh / var(--ui-scale));
        min-height: -webkit-fill-available;
      }
      .fullscreen-panel {
        position: fixed;
        top: 0;
        left: 0;
        width: calc(100vw / var(--ui-scale));
        height: calc(100vh / var(--ui-scale));
        height: -webkit-fill-available;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
    </style>
    <script type="module" crossorigin src="/duel-masters/assets/index-C_2tdl3P.js"></script>
    <link rel="stylesheet" crossorigin href="/duel-masters/assets/index-x1XGuNl0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
